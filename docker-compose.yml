version: '3.8'

services:
  geoagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geoagent-app
    ports:
      - "8080:8080"
    environment:
      - GEOAGENT_MONGODB_URI=mongodb://mongodb:27017
      - GEOAGENT_LLM_API_KEY=${GEMINI_API_KEY}
      - GEOAGENT_ORG_ID=${ORG_ID:-demo_org}
    volumes:
      - ./configs:/app/config:ro
      - ./data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - geoagent-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo:7
    container_name: geoagent-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-changeme}
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    restart: unless-stopped
    networks:
      - geoagent-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional: MongoDB Express for database administration
  mongo-express:
    image: mongo-express:latest
    container_name: geoagent-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASSWORD:-changeme}
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=${ADMIN_PASSWORD:-admin}
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - geoagent-network
    profiles:
      - admin

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local

networks:
  geoagent-network:
    driver: bridge
